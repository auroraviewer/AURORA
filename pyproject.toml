[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-wsi"
version = "2.0.0"
description = "AURORA: predict spatial gene expression and cell-type proportions from H&E whole-slide images"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "See LICENSE" }
authors = [{ name = "AURORA" }]
keywords = ["computational-pathology", "whole-slide-image", "spatial-transcriptomics", "deep-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# The runtime package itself is standard-library only: importing `aurora` pulls
# in no third-party module, which is what lets `--help`, `doctor`, `validate` and
# `inspect` work before anything is installed.  Every group below is therefore an
# extra, and `core` is light on purpose.
dependencies = []

[project.optional-dependencies]
# Mirrors aurora/deps.py -- `python tools/sync_requirements.py --check` fails if
# these drift, so edit deps.py and the requirements files, not this block.
core = [
    "numpy>=1.26",
    "pandas>=2.2.3",
    "Pillow>=10.0",
    "tqdm>=4.67.1",
    "PyYAML>=6.0",
    "h5py>=3.10",
    "torch>=2.0",
]
inference = [
    "numpy>=1.26",
