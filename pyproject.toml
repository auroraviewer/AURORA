[project.urls]
Documentation = "https://github.com/aurora-project/AURORA"

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools]
include-package-data = false
zip-safe = false

[tool.setuptools.packages.find]
# Only the new package is installed.  `code/` holds the original scripts, which
# are driven as subprocesses rather than imported, so they are not a package and
# must not be collected here.
include = ["aurora", "aurora.*"]
exclude = ["code*", "tools*", "tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
aurora = ["py.typed"]
